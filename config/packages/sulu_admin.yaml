sulu_admin:
    email: "%env(SULU_ADMIN_EMAIL)%"
    forms:
        directories:
            - "%kernel.project_dir%/config/forms"
    lists:
        directories:
            - "%kernel.project_dir%/config/lists"
    resources:
        leads:
            routes:
                list: app.get_leads
                detail: app.get_lead
        cookieConsents:
            routes:
                list: app.get_cookie_consents
                detail: app.get_cookie_consent
