worker_processes 1;

events {
    worker_connections 768;
}

http {
    include mime.types;
    server_tokens off;
    charset utf-8;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Default server
    server {
        listen 80 default_server;
        server_name _;
        return 444;
    }

    # odsct.local + *.odsct.local → static files + PHP-FPM
    server {
        listen 80;
        server_name odsct.local *.odsct.local;
        root /srv/public;
        client_max_body_size 128M;

        location / {
            try_files $uri /index.php$is_args$args;
        }

        location ~ ^/index\.php(/|$) {
            fastcgi_pass web:9000;
            fastcgi_split_path_info ^(.+\.php)(/.*)$;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT $realpath_root;
            fastcgi_buffers 64 4K;
            internal;
        }

        location ~ \.php$ {
            return 404;
        }

        error_log /var/log/nginx/error.log;
        access_log /var/log/nginx/access.log;
    }

    # vite.odsct.local → Vite dev server (HMR + assets)
    server {
        listen 80;
        server_name vite.odsct.local;

        location / {
            proxy_pass http://odsct-asset-builder:5173;
            include proxy-common.conf;
        }
    }

    # adminer.odsct.local → adminer
    server {
        listen 80;
        server_name adminer.odsct.local;
        client_max_body_size 128M;

        location / {
            proxy_pass http://adminer:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
        }
    }

    # mailer.odsct.local → mailpit web UI
    server {
        listen 80;
        server_name mailer.odsct.local;
        client_max_body_size 128M;

        location / {
            proxy_pass http://mailer:8025;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
        }
    }
}
